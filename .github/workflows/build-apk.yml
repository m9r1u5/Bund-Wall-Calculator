name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Read app version
        run: echo "VER=$(node -p "require('./version.json').version")" >> $GITHUB_ENV

      - name: Copy web app into www
        run: |
          mkdir -p www
          cp index.html styles.css calc.js draw.js pdf.js app.js manifest.json version.json icon-*.png www/

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: App icon, name and version
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          cp -r android-icons/* $RES/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BundWallCalculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BundWallCalculator-${{ env.VER }}
          path: BundWallCalculator.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Bund Wall Calculator v${{ env.VER }}
          body: Install BundWallCalculator.apk on your Android phone. Web version https://m9r1u5.github.io/Bund-Wall-Calculator/
          files: BundWallCalculator.apk
          make_latest: true
